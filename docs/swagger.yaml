basePath: /api
definitions:
  apperror.AppError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  appresponse.Meta:
    properties:
      paginate:
        $ref: '#/definitions/appresponse.Paginate'
      timestamp:
        type: string
    type: object
  appresponse.Paginate:
    properties:
      limit:
        type: integer
      next:
        type: string
      page:
        type: integer
      prev:
        type: string
      total_pages:
        type: integer
      total_rows:
        type: integer
    type: object
  appresponse.Response-any:
    properties:
      data: {}
      error:
        $ref: '#/definitions/apperror.AppError'
      message:
        type: string
      meta:
        $ref: '#/definitions/appresponse.Meta'
      success:
        type: boolean
    type: object
  dto.CreateExpensePayload:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      expense_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - amount
    - category_id
    - expense_date
    - title
    type: object
  dto.CreateIncomePayload:
    properties:
      amount:
        type: number
      category:
        maxLength: 100
        minLength: 1
        type: string
      income_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - amount
    - category
    - income_date
    - title
    type: object
  dto.UpdateExpensePayload:
    properties:
      amount:
        type: number
      category_id:
        minimum: 1
        type: integer
      expense_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateIncomePayload:
    properties:
      amount:
        type: number
      category:
        maxLength: 100
        minLength: 1
        type: string
      income_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
info:
  contact: {}
  description: A lightweight backend RESTful API designed for tracking and managing
    personal or organizational expenses. This API provides secure endpoints to log
    daily expenses, categorize spending, and generate basic financial summaries.
  title: API Backend Expense
  version: "1.0"
paths:
  /expenses:
    delete:
      consumes:
      - application/json
      description: delete expense
      parameters:
      - description: Income ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Remove expense
      tags:
      - expenses
    get:
      consumes:
      - application/json
      description: get all existing expense, or get one filters by expense id
      parameters:
      - description: Income ID (Optional)
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: List expense
      tags:
      - expenses
    post:
      consumes:
      - application/json
      description: create expense
      parameters:
      - description: Create new expense payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExpensePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Add new expense
      tags:
      - expenses
    put:
      consumes:
      - application/json
      description: update expense
      parameters:
      - description: Income ID
        in: query
        name: id
        required: true
        type: integer
      - description: Edit expense payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExpensePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Edit expense
      tags:
      - expenses
  /incomes:
    delete:
      consumes:
      - application/json
      description: delete income
      parameters:
      - description: Income ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Remove income
      tags:
      - incomes
    get:
      consumes:
      - application/json
      description: get all existing income, or get one filters by income id
      parameters:
      - description: Income ID (Optional)
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: List income
      tags:
      - incomes
    post:
      consumes:
      - application/json
      description: create income
      parameters:
      - description: Create new income payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateIncomePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Add new income
      tags:
      - incomes
    put:
      consumes:
      - application/json
      description: update income
      parameters:
      - description: Income ID
        in: query
        name: id
        required: true
        type: integer
      - description: Edit income payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateIncomePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appresponse.Response-any'
      summary: Edit income
      tags:
      - incomes
swagger: "2.0"
