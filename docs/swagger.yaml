basePath: /api
definitions:
  apperror.AppError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  dto.CreateCategoryPayload:
    properties:
      color:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateDebtPayload:
    properties:
      amount:
        type: number
      due_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      person_name:
        maxLength: 100
        minLength: 1
        type: string
      type:
        enum:
        - OWE
        - LENT
        type: string
    required:
    - amount
    - due_date
    - person_name
    - type
    type: object
  dto.CreateExpensePayload:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      expense_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - amount
    - category_id
    - expense_date
    - title
    type: object
  dto.CreateIncomePayload:
    properties:
      amount:
        type: number
      category:
        enum:
        - OTHER
        - SALARY
        - FREELANCE
        - BUSINESS
        - INVESTMENT
        - GIFT
        maxLength: 100
        minLength: 1
        type: string
      income_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - amount
    - category
    - income_date
    - title
    type: object
  dto.CreateTransferPayload:
    properties:
      amount:
        type: number
      destination_account:
        maxLength: 100
        minLength: 1
        type: string
      from_account:
        maxLength: 100
        minLength: 1
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
      transfer_date:
        example: "2006-01-02"
        type: string
    required:
    - amount
    - destination_account
    - from_account
    - title
    - transfer_date
    type: object
  dto.Meta:
    properties:
      paginate:
        $ref: '#/definitions/dto.Paginate'
      timestamp:
        type: string
    type: object
  dto.Paginate:
    properties:
      limit:
        type: integer
      next:
        type: string
      page:
        type: integer
      prev:
        type: string
      total_pages:
        type: integer
      total_rows:
        type: integer
    type: object
  dto.Response-any:
    properties:
      data: {}
      error:
        $ref: '#/definitions/apperror.AppError'
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
      success:
        type: boolean
    type: object
  dto.UpdateCategoryPayload:
    properties:
      color:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateDebtPayload:
    properties:
      amount:
        type: number
      due_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      person_name:
        maxLength: 100
        minLength: 1
        type: string
      type:
        enum:
        - OWE
        - LENT
        type: string
    type: object
  dto.UpdateExpensePayload:
    properties:
      amount:
        type: number
      category_id:
        minimum: 1
        type: integer
      expense_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateIncomePayload:
    properties:
      amount:
        type: number
      category:
        enum:
        - OTHER
        - SALARY
        - FREELANCE
        - BUSINESS
        - INVESTMENT
        - GIFT
        maxLength: 100
        minLength: 1
        type: string
      income_date:
        example: "2006-01-02"
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  dto.UpdateTransferPayload:
    properties:
      amount:
        type: number
      destination_account:
        maxLength: 100
        minLength: 1
        type: string
      from_account:
        maxLength: 100
        minLength: 1
        type: string
      note:
        maxLength: 255
        type: string
      title:
        maxLength: 100
        minLength: 1
        type: string
      transfer_date:
        example: "2006-01-02"
        type: string
    type: object
info:
  contact: {}
  description: A lightweight backend RESTful API designed for tracking and managing
    personal or organizational expenses. This API provides secure endpoints to log
    daily expenses, categorize spending, and generate basic financial summaries.
  title: API Backend Expense
  version: "1.0"
paths:
  /categories:
    get:
      consumes:
      - application/json
      description: get all existing category
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response-any'
      summary: List category
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: create category
      parameters:
      - description: Create new category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response-any'
      summary: Add new category
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: delete category
      parameters:
      - description: Income ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response-any'
      summary: Remove category
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: get one filters by category id
      parameters:
      - description: Income ID (Optional)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response-any'
      summary: Get an category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: update category
      parameters:
      - description: Income ID
        in: path
        name: id
        required: true
        type: integer
      - description: Edit category payload
